[package]
name = "argus-tui"
version.workspace = true
edition.workspace = true
description = "argus - terminal UI for orchestrating Claude Code agent sessions"

[[bin]]
name = "argus-tui"
path = "src/main.rs"

[dependencies]
argus-domain.workspace = true
argus-application.workspace = true
argus-infrastructure = { path = "../argus-infrastructure" }
serde_json.workspace = true
uuid.workspace = true
async-trait.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tui-term = "0.2"
vt100 = "0.15"
futures = "0.3"
anyhow = "1"
