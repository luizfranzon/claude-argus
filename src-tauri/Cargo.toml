[package]
name = "argus"
version.workspace = true
description = "argus - orchestrate Claude Code agent sessions"
authors = ["Luiz Fernando Franzon"]
license = ""
repository = ""
edition.workspace = true
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "argus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "argus"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
argus-domain.workspace = true
argus-application.workspace = true
argus-infrastructure.workspace = true
serde_json.workspace = true
serde.workspace = true
uuid.workspace = true
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
