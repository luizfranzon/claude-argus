[workspace]
resolver = "2"
members = [
    "crates/argus-domain",
    "crates/argus-application",
    "crates/argus-infrastructure",
    "crates/argus-tui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
argus-domain = { path = "crates/argus-domain" }
argus-application = { path = "crates/argus-application" }
argus-infrastructure = { path = "crates/argus-infrastructure" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
async-trait = "0.1"
notify-debouncer-mini = "0.4"
trash = "5"
